port 1194
proto udp
dev tun

# PKI (ver docs/05-vpn-openvpn.md)
ca ca.crt
cert server.crt
key server.key
dh dh.pem
tls-auth ta.key 0

# Red del túnel y rutas que se envían al cliente
server 10.8.0.0 255.255.255.0
push "route 192.168.0.0 255.255.255.0"

keepalive 10 120
cipher AES-256-GCM
auth SHA256

user nobody
group nogroup
persist-key
persist-tun
status /var/log/openvpn-status.log
verb 3
