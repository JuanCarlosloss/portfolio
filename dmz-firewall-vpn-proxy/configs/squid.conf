# Configuración mejorada de Squid para el laboratorio DMZ/VPN/Proxy.
# Copiar a /etc/squid/squid.conf y validar con: sudo squid -k parse

# --- Redes ---
acl localnet src 192.168.0.0/24      # red interna
acl vpnnet   src 192.168.1.10/32     # servidor VPN (tráfico de los clientes VPN, tras el NAT)

# --- Puertos y métodos ---
acl SSL_ports  port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# --- Filtrado y horario ---
acl blocked_sites dstdomain "/etc/squid/blacklist.txt"
acl working_hours time MTWHF 08:00-18:00     # lunes a viernes

# --- Reglas (se aplica la primera que coincide) ---
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_sites

# Fuera de horario laboral no se permite navegar
http_access allow localnet working_hours
http_access allow vpnnet   working_hours
http_access deny all

# --- Servicio ---
http_port 3128
access_log /var/log/squid/access.log squid
